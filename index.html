    // Dotted progress ring
    const DotRing = ({ value = 0, total = 7, size = 128, dots = 36, children }) => {
      const c = size / 2;
      const r = size / 2 - 7;
      const filled = Math.round((value / total) * dots);
      return (
        <div className="relative shrink-0" style={{ width: size, height: size }}>
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
            {Array.from({ length: dots }).map((_, i) => {
              const a = (i / dots) * 2 * Math.PI - Math.PI / 2;
              const on = i < filled;
              return <circle key={i} cx={c + r * Math.cos(a)} cy={c + r * Math.sin(a)} r={on ? 3.2 : 2.4} fill={on ? '#b5f23d' : '#3a3a40'} />;
            })}
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">{children}</div>
        </div>
      );
    };

    // Dynamic days calculation based on real current date
    const generateWeekDays = () => {
      const now = new Date();
      const currentDayIndex = now.getDay() === 0 ? 6 : now.getDay() - 1; // 0 = Mon, 6 = Sun
      
      const daysNames = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
      const shortNames = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];

      const monday = new Date(now);
      monday.setDate(now.getDate() - currentDayIndex);

      return daysNames.map((name, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);

        const isPast = i < currentDayIndex;
        const isToday = i === currentDayIndex;

        return {
          name,
          short: shortNames[i],
          date: String(d.getDate()).padStart(2, '0'),
          fullDate: d.toISOString().split('T')[0],
          label: d.toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' }),
          isPast,
          isToday
        };
      });
    };
