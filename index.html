<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORMA - Workout & BJJ Planner</title>
  
  <!-- PWA & Mobile Standalone Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#020617">
  <link rel="apple-touch-icon" href="https://placehold.co/180x180/020617/10B981?text=FORMA">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #020617;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Helper Component to render Lucide Icons dynamically
    const Icon = ({ name, className = "w-5 h-5", ...props }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);

      return <i data-lucide={name.toLowerCase()} class={className} {...props}></i>;
    };

    // Custom Jiu-Jitsu icon: kimono (gi) with belt
    const BJJIcon = ({ className = "w-5 h-5" }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        className={className}
        aria-hidden="true"
      >
        <path d="M9 3 3 6.5 5 11l2-1v11h10V10l2 1 2-4.5L15 3" />
        <path d="M9 3l3 7 3-7" />
        <path d="M7 15h10" />
        <path d="M12 15l-1.5 4" />
        <path d="M12 15l1.5 4" />
      </svg>
    );

    // Dynamic days calculation based on real current date
    const generateWeekDays = () => {
      const now = new Date();
      const currentDayIndex = now.getDay() === 0 ? 6 : now.getDay() - 1; // 0 = Mon, 6 = Sun
      
      const daysNames = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
      const shortNames = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];

      const monday = new Date(now);
      monday.setDate(now.getDate() - currentDayIndex);

      return daysNames.map((name, i) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);

        const isPast = i < currentDayIndex;
        const isToday = i === currentDayIndex;

        return {
          name,
          short: shortNames[i],
          date: String(d.getDate()).padStart(2, '0'),
          fullDate: d.toISOString().split('T')[0],
          isPast,
          isToday
        };
      });
    };

    const PRESET_LIBRARY_DEFAULT = {
      'Peito': ['Supino Reto (Barbell Bench Press)', 'Supino Inclinado com Halteres', 'Crucifixo na Polia (Cable Flyes)', 'Flexões (Push-Ups)', 'Fundos (Dips)'],
      'Costas': ['Puxada Alta (Lat Pulldown)', 'Levantamento Terra (Barbell Deadlift)', 'Remada Baixa (Seated Cable Row)', 'Barra Fixa (Pull-Ups)', 'Remada Curvada com Halteres'],
      'Pernas': ['Agachamento Livre (Barbell Squat)', 'Levantamento Terra Romeno (RDL)', 'Leg Press 45º', 'Afundos (Walking Lunges)', 'Cadeira Extensora', 'Mesa Flexora'],
      'Ombros': ['Desenvolvimento Militar (Military Press)', 'Elevação Lateral com Halteres', 'Face Pull', 'Desenvolvimento Arnold', 'Elevação Posterior'],
      'Braços': ['Rosca Direta com Barra', 'Tríceps Corda (Pushdown)', 'Rosca Martelo', 'Tríceps Testa', 'Rosca Scott'],
      'Core / Abdominais': ['Elevação de Pernas na Barra', 'Prancha Abdominal (Plank)', 'Rotação de Tronco na Polia', 'Ab Wheel Rollout', 'Abdominais Russos'],
      'Cardio': ['Corrida na Passadeira', 'Salto à Corda', 'Entradas de Queda (Takedown Shots)', 'Drills de Passagem de Guarda', 'Fuga de Quadril (Shrimping)']
    };

    const MUSCLE_GROUPS = [
      'Peito', 'Costas', 'Pernas', 'Ombros', 'Braços', 'Bíceps', 
      'Tríceps', 'Core / Abdominais', 'Cardio', 'Full Body', 'Superiores', 'Inferiores'
    ];

    function App() {
      const [weekDays, setWeekDays] = useState(generateWeekDays());
      const [user, setUser] = useState(() => {
        const saved = localStorage.getItem('fit_bjj_user');
        return saved ? JSON.parse(saved) : null;
      });
      const [authMode, setAuthMode] = useState('login');
      const [authInput, setAuthInput] = useState('');
      const [authPassword, setAuthPassword] = useState('');

      const [customLibrary, setCustomLibrary] = useState(() => {
        const saved = localStorage.getItem('fit_bjj_custom_library');
        if (saved) return JSON.parse(saved);
        return PRESET_LIBRARY_DEFAULT;
      });

      const [newLibraryExerciseName, setNewLibraryExerciseName] = useState('');
      const [selectedDay, setSelectedDay] = useState(() => {
        const today = weekDays.find(d => d.isToday);
        return today ? today.name : 'Segunda';
      });
      
      const [manualExerciseName, setManualExerciseName] = useState('');
      
      const [weeklyData, setWeeklyData] = useState(() => {
        const saved = localStorage.getItem('fit_bjj_weekly_data');
        if (saved) return JSON.parse(saved);
        return {
          Segunda: { type: 'gym', focus: 'Peito', exercises: [], notes: '', completed: false },
          Terça: { type: 'bjj', focus: 'Jiu-Jitsu', bjjDetails: { format: 'Gi' }, completed: true },
          Quarta: { type: 'gym', focus: 'Costas', exercises: [], notes: '', completed: false },
          Quinta: { type: 'bjj', focus: 'Jiu-Jitsu', bjjDetails: { format: 'No-Gi' }, completed: false },
          Sexta: { type: 'gym', focus: 'Pernas', exercises: [], notes: '', completed: false },
          Sábado: { type: 'rest', focus: 'Descanso', notes: 'Mobilidade ativa e descanso total', completed: false },
          Domingo: { type: 'rest', focus: 'Descanso', notes: 'Preparação para a nova semana', completed: false },
        };
      });

      const [expandedExerciseId, setExpandedExerciseId] = useState(null);
      const [libraryCategory, setLibraryCategory] = useState('Peito');
      const [activeTab, setActiveTab] = useState('planner');

      useEffect(() => {
        const interval = setInterval(() => {
          setWeekDays(generateWeekDays());
        }, 600000);
        return () => clearInterval(interval);
      }, []);

      const handleAuth = (e) => {
        e.preventDefault();
        if (!authInput.trim()) return;
        setUser({
          name: authInput.includes('@') ? authInput.split('@')[0] : authInput,
          identifier: authInput.trim(),
        });
      };

      const handleLogout = () => {
        setUser(null);
        localStorage.removeItem('fit_bjj_user');
      };

      useEffect(() => {
        localStorage.setItem('fit_bjj_weekly_data', JSON.stringify(weeklyData));
      }, [weeklyData]);

      useEffect(() => {
        localStorage.setItem('fit_bjj_custom_library', JSON.stringify(customLibrary));
      }, [customLibrary]);

      useEffect(() => {
        if (user) localStorage.setItem('fit_bjj_user', JSON.stringify(user));
        else localStorage.removeItem('fit_bjj_user');
      }, [user]);

      const handleAddExerciseToLibrary = (e) => {
        e.preventDefault();
        if (!newLibraryExerciseName.trim()) return;
        setCustomLibrary(prev => ({
          ...prev,
          [libraryCategory]: [...(prev[libraryCategory] || []), newLibraryExerciseName.trim()]
        }));
        setNewLibraryExerciseName('');
      };

      const handleRemoveFromLibrary = (category, exerciseName) => {
        setCustomLibrary(prev => ({
          ...prev,
          [category]: prev[category].filter(e => e !== exerciseName)
        }));
      };

      const setDayType = (day, type) => {
        let defaultFocus = type === 'bjj' ? 'Jiu-Jitsu' : type === 'rest' ? 'Descanso' : 'Peito';
        setWeeklyData(prev => ({
          ...prev,
          [day]: {
            ...prev[day],
            type,
            focus: prev[day].focus || defaultFocus,
            exercises: prev[day].exercises || [],
            bjjDetails: prev[day].bjjDetails || { format: 'Gi' }
          }
        }));
      };

      const setDayFocus = (day, focus) => {
        setWeeklyData(prev => ({ ...prev, [day]: { ...prev[day], focus } }));
      };

      const toggleDayComplete = (day) => {
        setWeeklyData(prev => ({ ...prev, [day]: { ...prev[day], completed: !prev[day].completed } }));
      };

      const addExerciseToCurrentDay = (name) => {
        if (!name || !name.trim()) return;
        const newId = Date.now();
        const newExercise = {
          id: newId,
          name: name.trim(),
          setsList: [
            { setNum: 1, reps: 10, weight: 20 },
            { setNum: 2, reps: 10, weight: 20 },
            { setNum: 3, reps: 10, weight: 20 }
          ]
        };
        setWeeklyData(prev => ({
          ...prev,
          [selectedDay]: {
            ...prev[selectedDay],
            exercises: [...(prev[selectedDay].exercises || []), newExercise]
          }
        }));
        setManualExerciseName('');
        setExpandedExerciseId(newId);
      };

      const removeExercise = (id, e) => {
        if (e) e.stopPropagation();
        setWeeklyData(prev => ({
          ...prev,
          [selectedDay]: {
            ...prev[selectedDay],
            exercises: prev[selectedDay].exercises.filter(ex => ex.id !== id)
          }
        }));
      };

      const updateExerciseSet = (exerciseId, setIndex, field, value) => {
        setWeeklyData(prev => {
          const dayExercises = prev[selectedDay].exercises.map(ex => {
            if (ex.id !== exerciseId) return ex;
            const updatedSets = [...ex.setsList];
            updatedSets[setIndex] = {
              ...updatedSets[setIndex],
              [field]: parseFloat(value) || 0
            };
            return { ...ex, setsList: updatedSets };
          });
          return {
            ...prev,
            [selectedDay]: { ...prev[selectedDay], exercises: dayExercises }
          };
        });
      };

      const addSetToExercise = (exerciseId) => {
        setWeeklyData(prev => {
          const dayExercises = prev[selectedDay].exercises.map(ex => {
            if (ex.id !== exerciseId) return ex;
            const lastSet = ex.setsList[ex.setsList.length - 1];
            const newSet = {
              setNum: ex.setsList.length + 1,
              reps: lastSet ? lastSet.reps : 10,
              weight: lastSet ? lastSet.weight : 20
            };
            return { ...ex, setsList: [...ex.setsList, newSet] };
          });
          return {
            ...prev,
            [selectedDay]: { ...prev[selectedDay], exercises: dayExercises }
          };
        });
      };

      const removeSetFromExercise = (exerciseId, setIndex) => {
        setWeeklyData(prev => {
          const dayExercises = prev[selectedDay].exercises.map(ex => {
            if (ex.id !== exerciseId) return ex;
            if (ex.setsList.length <= 1) return ex;
            const filtered = ex.setsList.filter((_, idx) => idx !== setIndex);
            const renumbered = filtered.map((s, idx) => ({ ...s, setNum: idx + 1 }));
            return { ...ex, setsList: renumbered };
          });
          return {
            ...prev,
            [selectedDay]: { ...prev[selectedDay], exercises: dayExercises }
          };
        });
      };

      const updateBJJDetails = (field, value) => {
        setWeeklyData(prev => ({
          ...prev,
          [selectedDay]: {
            ...prev[selectedDay],
            bjjDetails: { ...prev[selectedDay].bjjDetails, [field]: value }
          }
        }));
      };

      const currentDayInfo = weekDays.find(d => d.name === selectedDay) || { isPast: false, isToday: false };
      const currentDayData = weeklyData[selectedDay] || { type: 'gym', focus: 'Peito', exercises: [], completed: false };

      if (!user) {
        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-7 shadow-2xl relative overflow-hidden">
              <div className="text-center mb-8">
                <div className="w-16 h-16 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                  <Icon name="Dumbbell" className="w-8 h-8 text-emerald-400" />
                </div>
                <h1 className="text-3xl font-black tracking-tight text-white">
                  FORMA
                </h1>
                <p className="text-slate-400 text-xs mt-1 font-medium">Weekly Training & BJJ Tracker</p>
              </div>

              <div className="flex bg-slate-800/80 p-1.5 rounded-2xl mb-6 border border-slate-700/50">
                <button
                  type="button"
                  onClick={() => setAuthMode('login')}
                  className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all ${
                    authMode === 'login' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Login
                </button>
                <button
                  type="button"
                  onClick={() => setAuthMode('signup')}
                  className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all ${
                    authMode === 'signup' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  Sign Up
                </button>
              </div>

              <form onSubmit={handleAuth} className="space-y-4">
                <div>
                  <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5 ml-1">
                    Email ou Telemóvel
                  </label>
                  <input
                    type="text"
                    required
                    placeholder="Insere o telemóvel ou email"
                    value={authInput}
                    onChange={(e) => setAuthInput(e.target.value)}
                    className="w-full bg-slate-800/60 border border-slate-700 rounded-2xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-colors"
                  />
                </div>

                <div>
                  <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5 ml-1">
                    Palavra-passe
                  </label>
                  <input
                    type="password"
                    required
                    placeholder="••••••••"
                    value={authPassword}
                    onChange={(e) => setAuthPassword(e.target.value)}
                    className="w-full bg-slate-800/60 border border-slate-700 rounded-2xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-colors"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold py-3.5 rounded-2xl text-xs transition-colors shadow-lg shadow-emerald-500/20 mt-2"
                >
                  {authMode === 'login' ? 'Entrar' : 'Criar Conta'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-24 flex justify-center">
          <div className="w-full max-w-md min-h-screen flex flex-col relative bg-slate-950 border-x border-slate-900">
            
            {/* Top Header */}
            <header className="px-6 pt-6 pb-4 flex justify-between items-center border-b border-slate-900">
              <div>
                <h1 className="text-xl font-black text-white tracking-wider flex items-center gap-1.5">
                  FORMA
                </h1>
                <p className="text-xs text-slate-400 font-semibold mt-0.5">Olá, {user.name} 👋</p>
              </div>

              <button
                onClick={() => setActiveTab('profile')}
                className="w-10 h-10 rounded-2xl bg-slate-900 border border-slate-800 text-emerald-400 flex items-center justify-center font-bold hover:bg-slate-800 transition-colors"
              >
                <Icon name="User" className="w-5 h-5 text-emerald-400" />
              </button>
            </header>

            {/* Main Content */}
            <main className="flex-1 px-5 py-5 space-y-5">
              {activeTab === 'planner' && (
                <>
                  {/* Weekly Calendar Strip */}
                  <section className="bg-slate-900/40 border border-slate-800/50 rounded-3xl p-4 space-y-3">
                    <div className="flex justify-between items-center px-1">
                      <div>
                        <span className="text-xs font-black uppercase tracking-wider text-emerald-400">Plano Semanal</span>
                        <p className="text-[10px] text-slate-400 mt-0.5 font-medium">Dias passados arquivam automaticamente</p>
                      </div>
                      <span className="text-[10px] font-bold text-slate-400 bg-slate-800/50 border border-slate-700/40 px-2.5 py-1 rounded-full">
                        Semana Ativa
                      </span>
                    </div>

                    <div className="grid grid-cols-7 gap-1.5">
                      {weekDays.map((d) => {
                        const isSelected = d.name === selectedDay;
                        const dayData = weeklyData[d.name];
                        
                        return (
                          <button
                            key={d.name}
                            onClick={() => setSelectedDay(d.name)}
                            className={`flex flex-col items-center py-2.5 rounded-2xl transition-all relative ${
                              isSelected 
                                ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/10 font-bold scale-105 z-10' 
                                : d.isPast
                                ? 'bg-slate-900/30 text-slate-600 border border-slate-800/30 opacity-60'
                                : 'bg-slate-800/30 text-slate-300 hover:bg-slate-800/50 border border-slate-800/40'
                            }`}
                          >
                            {d.isPast && (
                              <Icon name="Archive" className="w-2.5 h-2.5 absolute top-1.5 right-1.5 text-slate-500" />
                            )}
                            <span className="text-sm font-extrabold">{d.date}</span>
                            <span className="text-[9px] uppercase tracking-wider font-semibold opacity-80">{d.short}</span>
                            {dayData?.completed && (
                              <div className={`w-1.5 h-1.5 rounded-full mt-1 ${isSelected ? 'bg-slate-950' : 'bg-emerald-400'}`} />
                            )}
                          </button>
                        );
                      })}
                    </div>
                  </section>

                  {/* Day Details Card */}
                  <section className="bg-slate-900/30 border border-slate-800/40 rounded-3xl p-4 space-y-3">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-black uppercase tracking-wider text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">
                          {selectedDay}
                        </span>
                        {currentDayInfo.isPast && (
                          <span className="text-[10px] font-bold uppercase tracking-wider text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2.5 py-1 rounded-full flex items-center gap-1">
                            <Icon name="Archive" className="w-3 h-3 text-amber-400" /> Arquivado
                          </span>
                        )}
                        {currentDayInfo.isToday && (
                          <span className="text-[10px] font-bold uppercase tracking-wider text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-2.5 py-1 rounded-full">
                            Hoje
                          </span>
                        )}
                      </div>

                      <button
                        onClick={() => toggleDayComplete(selectedDay)}
                        className={`w-9 h-9 rounded-2xl flex items-center justify-center transition-all ${
                          currentDayData.completed 
                            ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-500/20' 
                            : 'bg-slate-800/40 text-slate-500 hover:text-slate-300 border border-slate-800/60'
                        }`}
                      >
                        <Icon name="Check" className="w-4 h-4" />
                      </button>
                    </div>

                    {/* Day Type Selector */}
                    <div className="grid grid-cols-3 gap-2 pt-1">
                      <button
                        onClick={() => setDayType(selectedDay, 'gym')}
                        className={`py-2.5 px-2 rounded-2xl font-bold text-xs flex flex-col items-center gap-1 border transition-all ${
                          currentDayData.type === 'gym'
                            ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30'
                            : 'bg-slate-800/20 text-slate-400 border-slate-800/40 hover:border-slate-700/50'
                        }`}
                      >
                        <Icon name="Dumbbell" className="w-4 h-4" />
                        <span>Ginásio</span>
                      </button>

                      <button
                        onClick={() => setDayType(selectedDay, 'bjj')}
                        className={`py-2.5 px-2 rounded-2xl font-bold text-xs flex flex-col items-center gap-1 border transition-all ${
                          currentDayData.type === 'bjj'
                            ? 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30'
                            : 'bg-slate-800/20 text-slate-400 border-slate-800/40 hover:border-slate-700/50'
                        }`}
                      >
                        <BJJIcon className="w-4 h-4" />
                        <span>Jiu-Jitsu</span>
                      </button>

                      <button
                        onClick={() => setDayType(selectedDay, 'rest')}
                        className={`py-2.5 px-2 rounded-2xl font-bold text-xs flex flex-col items-center gap-1 border transition-all ${
                          currentDayData.type === 'rest'
                            ? 'bg-slate-800/40 text-slate-200 border-slate-700/50'
                            : 'bg-slate-800/20 text-slate-400 border-slate-800/40 hover:border-slate-700/50'
                        }`}
                      >
                        <span className="w-4 h-4 flex items-center justify-center text-xs font-black">OFF</span>
                        <span>Descanso</span>
                      </button>
                    </div>

                    {/* Focus Selector */}
                    {currentDayData.type === 'gym' && (
                      <div className="pt-2 border-t border-slate-800/40">
                        <div className="flex items-center justify-between mb-2">
                          <label className="text-[10px] font-extrabold uppercase tracking-wider text-slate-400">
                            Categoria do Dia
                          </label>
                          <span className="text-[10px] font-bold text-slate-400 bg-slate-800/40 px-2 py-0.5 rounded-full border border-slate-800/50">
                            {currentDayData.focus}
                          </span>
                        </div>
                        <div className="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none">
                          {MUSCLE_GROUPS.map((group) => (
                            <button
                              key={group}
                              type="button"
                              onClick={() => setDayFocus(selectedDay, group)}
                              className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                                currentDayData.focus === group
                                  ? 'bg-emerald-500 text-slate-950 font-black shadow-sm'
                                  : 'bg-slate-800/30 text-slate-400 hover:bg-slate-800/60 border border-slate-800/30'
                              }`}
                            >
                              {group}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </section>

                  {/* Gym Exercises Flow */}
                  {currentDayData.type === 'gym' && (
                    <section className="space-y-3">
                      {/* Choose / Add Exercises */}
                      <div className="bg-slate-900/30 border border-slate-800/40 rounded-3xl p-4 space-y-3">
                        <div className="flex items-center justify-between">
                          <h3 className="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">
                            Escolher Exercícios ({currentDayData.focus})
                          </h3>
                          <button
                            onClick={() => setActiveTab('library')}
                            className="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-xl text-[10px] font-bold flex items-center gap-1 hover:bg-emerald-500/20"
                          >
                            <Icon name="BookOpen" className="w-3 h-3" />
                            <span>Ver Biblioteca</span>
                          </button>
                        </div>

                        {/* Quick suggestions from selected category */}
                        {customLibrary[`${currentDayData.focus}`] ? (
                          <div className="space-y-1.5 pt-0.5">
                            <span className="text-[10px] text-slate-500 font-bold block">Sugestões de {currentDayData.focus}:</span>
                            <div className="flex flex-wrap gap-1.5">
                              {(customLibrary[currentDayData.focus] || []).map((exName, idx) => (
                                <button
                                  key={idx}
                                  onClick={() => addExerciseToCurrentDay(exName)}
                                  className="px-2.5 py-1 rounded-xl bg-slate-900/60 hover:bg-emerald-500/20 border border-slate-800/50 text-slate-300 hover:text-emerald-400 text-xs font-semibold flex items-center gap-1 transition-colors"
                                >
                                  <Icon name="Plus" className="w-3 h-3 text-emerald-400" />
                                  <span>{exName}</span>
                                </button>
                              ))}
                            </div>
                          </div>
                        ) : null}

                        {/* Custom Add Input */}
                        <div className="flex gap-2 pt-1">
                          <input
                            type="text"
                            placeholder="Ou escreve o nome de outro exercício..."
                            value={manualExerciseName}
                            onChange={(e) => setManualExerciseName(e.target.value)}
                            onKeyDown={(e) => {
                              if (e.key === 'Enter') {
                                e.preventDefault();
                                addExerciseToCurrentDay(manualExerciseName);
                              }
                            }}
                            className="flex-1 bg-slate-950/60 border border-slate-800/60 rounded-2xl px-4 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500/50"
                          />
                          <button
                            onClick={() => addExerciseToCurrentDay(manualExerciseName)}
                            className="bg-emerald-500/90 hover:bg-emerald-400 text-slate-950 font-bold px-4 rounded-2xl text-xs flex items-center justify-center gap-1 transition-colors"
                          >
                            <Icon name="Plus" className="w-4 h-4" />
                            <span>Adicionar</span>
                          </button>
                        </div>
                      </div>

                      {/* Configure Sets and Weights for added exercises */}
                      <div className="space-y-3">
                        <div className="px-1 flex justify-between items-center">
                          <h3 className="text-xs font-extrabold uppercase tracking-wider text-emerald-400">
                            Exercícios do Dia ({currentDayData.exercises?.length || 0})
                          </h3>
                        </div>

                        {(!currentDayData.exercises || currentDayData.exercises.length === 0) ? (
                          <div className="text-center py-10 bg-slate-900/30 rounded-3xl border border-dashed border-slate-800/60">
                            <Icon name="Dumbbell" className="w-8 h-8 text-slate-700 mx-auto mb-2" />
                            <p className="text-xs text-slate-500 font-medium">Nenhum exercício selecionado.</p>
                            <p className="text-[10px] text-slate-600 mt-0.5">Escolha um exercício na secção acima.</p>
                          </div>
                        ) : (
                          currentDayData.exercises.map((ex) => {
                            const isExpanded = expandedExerciseId === ex.id;

                            return (
                              <div 
                                key={ex.id} 
                                className={`bg-slate-900/60 border rounded-3xl transition-all shadow-sm overflow-hidden ${
                                  isExpanded ? 'border-emerald-500/50 ring-1 ring-emerald-500/30 p-4 space-y-3' : 'border-slate-800/60 p-4 hover:border-slate-700/60 cursor-pointer'
                                }`}
                                onClick={() => !isExpanded && setExpandedExerciseId(ex.id)}
                              >
                                {/* Card Header */}
                                <div className="flex items-start justify-between">
                                  <div className="flex-1 pr-2">
                                    <h4 className="font-extrabold text-sm text-white flex items-center gap-2">
                                      <span className={`w-2 h-2 rounded-full ${isExpanded ? 'bg-emerald-400' : 'bg-slate-500'}`} />
                                      {ex.name}
                                    </h4>
                                    
                                    {/* Summary underneath when collapsed: e.g. 10 - 20kg */}
                                    {!isExpanded && (
                                      <p className="text-[11px] text-slate-400 font-medium mt-1 pl-4 flex flex-wrap gap-x-2 gap-y-0.5">
                                        {ex.setsList.map((s, sIdx) => (
                                          <span key={s.setNum || sIdx} className="inline-flex items-center gap-0.5 bg-slate-950 px-2 py-0.5 rounded-md border border-slate-800/80">
                                            <strong className="text-emerald-400">{s.reps}</strong> - {s.weight}kg
                                          </span>
                                        ))}
                                      </p>
                                    )}
                                  </div>

                                  <div className="flex items-center gap-1">
                                    {isExpanded && (
                                      <button
                                        type="button"
                                        onClick={(e) => {
                                          e.stopPropagation();
                                          setExpandedExerciseId(null);
                                        }}
                                        className="px-2.5 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] font-bold"
                                      >
                                        Concluído
                                      </button>
                                    )}
                                    <button
                                      type="button"
                                      onClick={(e) => removeExercise(ex.id, e)}
                                      className="w-7 h-7 rounded-xl bg-slate-800/80 text-slate-500 hover:text-rose-400 flex items-center justify-center"
                                    >
                                      <Icon name="Trash2" className="w-3.5 h-3.5" />
                                    </button>
                                  </div>
                                </div>

                                {/* Detailed Editable Sets when Expanded */}
                                {isExpanded && (
                                  <div className="space-y-2 pt-2 border-t border-slate-800/80">
                                    <div className="flex justify-between items-center text-[10px] font-bold uppercase tracking-wider text-slate-400 px-1">
                                      <span>Série</span>
                                      <span>Repetições</span>
                                      <span>Carga (Kg)</span>
                                      <span>Remover</span>
                                    </div>

                                    {ex.setsList.map((s, idx) => (
                                      <div key={idx} className="flex items-center justify-between gap-2 bg-slate-950 p-2 rounded-2xl border border-slate-800">
                                        <span className="w-8 text-center font-black text-emerald-400 text-xs">
                                          {s.setNum}
                                        </span>

                                        <div className="flex items-center justify-center gap-1">
                                          <input
                                            type="number"
                                            value={s.reps}
                                            onChange={(e) => updateExerciseSet(ex.id, idx, 'reps', e.target.value)}
                                            className="w-16 bg-slate-900 border border-slate-700 rounded-xl py-1 px-2 text-center text-xs font-bold text-white focus:outline-none focus:border-emerald-500"
                                          />
                                          <span className="text-[10px] font-semibold text-slate-500">reps</span>
                                        </div>

                                        <div className="flex items-center justify-center gap-1">
                                          <input
                                            type="number"
                                            value={s.weight}
                                            onChange={(e) => updateExerciseSet(ex.id, idx, 'weight', e.target.value)}
                                            className="w-16 bg-slate-900 border border-slate-700 rounded-xl py-1 px-2 text-center text-xs font-bold text-white focus:outline-none focus:border-emerald-500"
                                          />
                                          <span className="text-[10px] font-semibold text-slate-500">kg</span>
                                        </div>

                                        <button
                                          type="button"
                                          onClick={() => removeSetFromExercise(ex.id, idx)}
                                          disabled={ex.setsList.length <= 1}
                                          className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs ${
                                            ex.setsList.length <= 1 ? 'text-slate-700 cursor-not-allowed' : 'text-slate-500 hover:text-rose-400 hover:bg-slate-800'
                                          }`}
                                        >
                                          <Icon name="X" className="w-3.5 h-3.5" />
                                        </button>
                                      </div>
                                    ))}

                                    <button
                                      type="button"
                                      onClick={() => addSetToExercise(ex.id)}
                                      className="w-full py-2 bg-slate-950 hover:bg-slate-800 border border-dashed border-slate-800 hover:border-slate-700 text-emerald-400 text-xs font-bold rounded-2xl flex items-center justify-center gap-1.5 transition-colors mt-2"
                                    >
                                      <Icon name="Plus" className="w-3.5 h-3.5" />
                                      <span>Adicionar Série (+1 Set)</span>
                                    </button>
                                  </div>
                                )}
                              </div>
                            );
                          })
                        )}
                      </div>
                    </section>
                  )}

                  {/* BJJ Details */}
                  {currentDayData.type === 'bjj' && (
                    <section className="bg-slate-900/40 border border-slate-800/50 rounded-3xl p-5 space-y-4 shadow-sm">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <BJJIcon className="w-4 h-4 text-cyan-400" />
                        <span>Detalhes de Jiu-Jitsu</span>
                      </h3>
                      
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={() => updateBJJDetails('format', 'Gi')}
                          className={`py-3 rounded-2xl text-xs font-bold border transition-all ${
                            currentDayData.bjjDetails?.format === 'Gi'
                              ? 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30'
                              : 'bg-slate-800/50 text-slate-400 border-slate-800'
                          }`}
                        >
                          Kimono (Gi)
                        </button>
                        <button
                          onClick={() => updateBJJDetails('format', 'No-Gi')}
                          className={`py-3 rounded-2xl text-xs font-bold border transition-all ${
                            currentDayData.bjjDetails?.format === 'No-Gi'
                              ? 'bg-cyan-500/10 text-cyan-400 border-cyan-500/30'
                              : 'bg-slate-800/50 text-slate-400 border-slate-800'
                          }`}
                        >
                          Sem Kimono (No-Gi)
                        </button>
                      </div>
                    </section>
                  )}
                </>
              )}

              {activeTab === 'library' && (
                <section className="space-y-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-sm">
                    <h2 className="text-xl font-extrabold text-white">Biblioteca de Exercícios</h2>

                    {/* Form to Add to Library */}
                    <form onSubmit={handleAddExerciseToLibrary} className="space-y-3 pt-1 border-t border-slate-800">
                      <label className="text-xs font-bold text-slate-300 block">Adicionar Novo Exercício à Biblioteca</label>
                      
                      <div className="flex gap-2">
                        <select
                          value={libraryCategory}
                          onChange={(e) => setLibraryCategory(e.target.value)}
                          className="bg-slate-950 border border-slate-800 rounded-2xl px-3 py-2.5 text-xs font-bold text-white focus:outline-none"
                        >
                          {Object.keys(customLibrary).map((cat) => (
                            <option key={cat} value={cat}>{cat}</option>
                          ))}
                        </select>

                        <input
                          type="text"
                          placeholder="Nome do exercício..."
                          value={newLibraryExerciseName}
                          onChange={(e) => setNewLibraryExerciseName(e.target.value)}
                          className="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none"
                        />
                      </div>

                      <button
                        type="submit"
                        className="w-full bg-emerald-500 text-slate-950 font-bold py-3 rounded-2xl text-xs flex items-center justify-center gap-1.5 hover:bg-emerald-400 transition-colors"
                      >
                        <Icon name="Plus" className="w-4 h-4" />
                        <span>Guardar na Biblioteca</span>
                      </button>
                    </form>
                  </div>

                  {/* Preset Lists */}
                  <div className="space-y-3">
                    {Object.entries(customLibrary).map(([category, exercises]) => (
                      <div key={category} className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-3 shadow-sm">
                        <div className="flex justify-between items-center">
                          <h3 className="font-extrabold text-sm text-white">{category}</h3>
                          <span className="text-[10px] font-bold text-slate-400 bg-slate-800 px-2.5 py-1 rounded-full">
                            {exercises.length} exercícios
                          </span>
                        </div>

                        <div className="space-y-2">
                          {exercises.map((exName, idx) => (
                            <div key={idx} className="flex items-center justify-between p-3 bg-slate-950 rounded-2xl text-xs font-medium text-slate-300 border border-slate-800/80">
                              <span>{exName}</span>
                              <div className="flex items-center gap-1.5">
                                <button
                                  onClick={() => {
                                    addExerciseToCurrentDay(exName);
                                    setActiveTab('planner');
                                  }}
                                  className="px-2.5 py-1 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-bold text-[10px] hover:bg-emerald-500/20"
                                >
                                  + {selectedDay}
                                </button>
                                <button
                                  onClick={() => handleRemoveFromLibrary(category, exName)}
                                  className="w-6 h-6 rounded-full text-slate-500 hover:text-rose-400 flex items-center justify-center"
                                >
                                  <Icon name="X" className="w-3 h-3" />
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </section>
              )}

              {activeTab === 'profile' && (
                <section className="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-6 shadow-sm">
                  <div className="text-center">
                    <div className="w-20 h-20 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-3xl flex items-center justify-center mx-auto mb-3 shadow-lg">
                      <Icon name="User" className="w-10 h-10 text-emerald-400" />
                    </div>
                    <h2 className="text-xl font-extrabold text-white">{user.name}</h2>
                    <p className="text-slate-400 text-xs mt-0.5">{user.identifier}</p>
                  </div>

                  <div className="bg-slate-950 p-4 rounded-2xl space-y-2 border border-slate-800">
                    <div className="flex justify-between text-xs">
                      <span className="text-slate-400 font-medium">Estado da Conta</span>
                      <span className="font-bold text-emerald-400">Ativa</span>
                    </div>
                    <div className="flex justify-between text-xs">
                      <span className="text-slate-400 font-medium">Sincronização Local</span>
                      <span className="font-bold text-slate-200">Ativado</span>
                    </div>
                  </div>

                  <button
                    onClick={handleLogout}
                    className="w-full bg-rose-500/10 text-rose-400 border border-rose-500/20 font-bold py-3.5 rounded-2xl hover:bg-rose-500/20 transition-colors flex items-center justify-center gap-2 text-xs"
                  >
                    <Icon name="LogOut" className="w-4 h-4" />
                    <span>Terminar Sessão</span>
                  </button>
                </section>
              )}
            </main>

            {/* Floating Bottom Navigation */}
            <nav className="fixed bottom-4 left-1/2 -translate-x-1/2 z-30 bg-slate-900/90 backdrop-blur-md border border-slate-800 text-white rounded-full px-6 py-3 flex items-center gap-8 shadow-2xl">
              <button
                onClick={() => setActiveTab('planner')}
                className={`p-2 rounded-xl transition-all ${activeTab === 'planner' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}
              >
                <Icon name="Calendar" className="w-5 h-5" />
              </button>

              <button
                onClick={() => setActiveTab('library')}
                className={`p-2 rounded-xl transition-all ${activeTab === 'library' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}
              >
                <Icon name="BookOpen" className="w-5 h-5" />
              </button>

              <button
                onClick={() => setActiveTab('profile')}
                className={`p-2 rounded-xl transition-all ${activeTab === 'profile' ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white'}`}
              >
                <Icon name="User" className="w-5 h-5" />
              </button>
            </nav>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
